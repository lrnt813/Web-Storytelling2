# Sinkronkan dashboard ke Hugging Face Space (Docker) setiap kali main berubah.
# Persiapan (sekali): di GitHub → Settings → Secrets and variables → Actions
#   - Secrets   : HF_TOKEN  = token Hugging Face dengan izin "write"
#   - Variables : HF_SPACE  = NAMA_PENGGUNA_HF/dashboard-tes-kulonprogo
# Lihat docs/DEPLOY.md bagian "Hugging Face Spaces".
name: Sinkronkan ke Hugging Face Space

on:
  push:
    branches: [main]
    paths:                       # hanya bila berkas yang dipakai server berubah (hemat kuota Git LFS)
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "data/*.gpkg"
      - "data/*.tif"
      - "data/thesis_*"
      - "data/locked/*"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pengaturan_hasil.json"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:             # bisa juga dijalankan manual dari tab Actions

jobs:
  sync:
    if: vars.HF_SPACE != ''     # dilewati sampai variable HF_SPACE diisi (tidak dianggap gagal)
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Periksa konfigurasi
        if: env.HF_TOKEN == ''
        run: |
          echo "::error::Secret HF_TOKEN belum diisi (lihat docs/DEPLOY.md)."
          exit 1

      - uses: actions/checkout@v4

      # Berkas Git LFS (GeoPackage) di-cache agar kuota bandwidth LFS GitHub tidak habis
      - name: Daftar objek LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Unduh berkas LFS
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unggah ke Hugging Face Space
        run: |
          pip install --quiet "huggingface_hub>=0.30"
          python -m scripts.deploy_hf_space --space "$HF_SPACE"
