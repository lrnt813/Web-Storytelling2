# Deploy dashboard ke Hugging Face Spaces (Docker).
# Jalankan manual: GitHub → Actions → "Deploy ke Hugging Face Spaces" → Run workflow.
# Butuh: secret HF_TOKEN (token Hugging Face, izin "Write") dan
#        variable HF_SPACE (mis. "lrnt813/dashboard-tes-banjir").
name: Deploy ke Hugging Face Spaces

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode (tanpa file LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Ambil hanya data LFS yang dipakai server (~130 MB)
        run: git lfs pull --include="data/*.gpkg"

      - name: Susun snapshot untuk Space
        run: |
          set -e
          mkdir -p deploy/data/locked
          cp -r backend frontend scripts main.py Dockerfile .dockerignore requirements.txt README.md deploy/
          cp data/*.gpkg data/thesis_results.json data/thesis_grid_results.csv.gz deploy/data/
          cp data/locked/* deploy/data/locked/
          find deploy -name __pycache__ -type d -prune -exec rm -rf {} +
          cd deploy
          git init -q -b main
          git lfs install --local
          git lfs track "*.gpkg" "*.gz" > /dev/null   # Hugging Face mewajibkan file biner lewat LFS
          git add .gitattributes
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
              commit -q -m "Deploy dari GitHub ${GITHUB_SHA::7}"
          du -sh .

      - name: Push ke Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Secret HF_TOKEN dan variable HF_SPACE belum diisi (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          cd deploy
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Selesai. Space: https://huggingface.co/spaces/${HF_SPACE}"
