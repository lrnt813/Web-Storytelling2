# Netlify hanya menyajikan frontend (folder frontend/). Server Python (backend FastAPI) berjalan di Hugging Face
# Space; semua permintaan /api/* diteruskan ke sana sehingga kode frontend tidak perlu diubah.
# WAJIB: ganti NAMA-PENGGUNA-HF di bawah dengan alamat Space Anda (lihat docs/DEPLOY.md, "Hugging Face Spaces"),
# formatnya https://<nama-pengguna-hf>-<nama-space>.hf.space

[build]
  publish = "frontend"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://NAMA-PENGGUNA-HF-dashboard-tes-kulonprogo.hf.space/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
