<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Evakuasi Cerdas - Kulon Progo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css?v=3">

</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top:25px; font-weight:600; letter-spacing:2px; color:var(--text-dim); font-size:12px;">ENGINEERING DATA SPASIAL...</p>
    </div>

    <header class="app-header">
        <i class="fa fa-compass" style="color:var(--accent-primary); font-size:22px;"></i>
        <h1>SISTEM NAVIGASI EVAKUASI TERPADU</h1>
    </header>

    <div class="control-panel glass-panel">
        <div class="search-container">
            <div class="search-input-wrap">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="map-search" placeholder="Pencarian" autocomplete="off">
                <i class="fa fa-times search-clear" id="search-clear"></i>
                <div id="search-results" class="search-results-list"></div>
            </div>
            <button class="btn-icon" onclick="locateUser()" title="Gunakan GPS">
                <i class="fa fa-location-crosshairs"></i>
            </button>
        </div>

        <h2>Pilihan Skenario</h2>
        
        <div class="form-group">
            <label>Tipe Ancaman</label>
            <select id="skenario">
                <option value="banjir">Banjir Luapan</option>
                <option value="banjir_bandang">Banjir Bandang</option>
                <option value="tanah_longsor">Tanah Longsor</option>
            </select>
        </div>

        <div class="form-group">
            <label>Intensitas Bahaya: <span id="val-intensitas" style="color:var(--accent-primary)">0</span>%</label>
            <input type="range" id="intensitas" min="0" max="1" step="0.1" value="0" 
                   oninput="document.getElementById('val-intensitas').innerText = Math.round(this.value*100)">
        </div>

        <button class="btn-premium" onclick="fetchAndRenderData()">
            <i class="fa fa-sync-alt"></i> ANALISIS KLASTER
        </button>

        <div style="margin: 25px 0; border-top: 1px solid var(--glass-border);"></div>

        <h2>Simulasi Lapangan</h2>
        <div class="mode-container">
            <button class="btn-outline active" id="btn-mode-visualize" onclick="toggleMode('visualize')">
                <i class="fa fa-info-circle"></i><span>Info Grid</span>
            </button>
            <button class="btn-outline" id="btn-mode-cut" onclick="toggleMode('cut')">
                <i class="fa fa-ban"></i><span>Blokir Jalan</span>
            </button>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; border: 1px solid var(--glass-border);">
            <input type="checkbox" id="check-roads" onchange="toggleRoads(this.checked)" style="width: 22px; height: 22px; cursor: pointer;">
            <label style="margin: 0; cursor: pointer; font-size: 13px;" for="check-roads">Render Jaringan Jalan</label>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; border: 1px solid var(--glass-border); margin-top: 10px;">
            <input type="checkbox" id="check-clusters" onchange="toggleClusters(this.checked)" style="width: 22px; height: 22px; cursor: pointer;">
            <label style="margin: 0; cursor: pointer; font-size: 13px;" for="check-clusters">Matikan Visual Klaster</label>
        </div>

        <button class="btn-outline" style="width: 100%; border-color: var(--danger); color: var(--danger); margin-top: 10px;" onclick="resetSimulation()">
            <i class="fa fa-trash-restore"></i> RESET SIMULASI
        </button>
    </div>

    <div class="route-results glass-panel" id="route-results">
        <h2>Rute Evakuasi Optimal</h2>
        <div id="route-list">
            <!-- Dinamis via JS -->
        </div>
        <p style="font-size: 10px; color: var(--text-dim); margin-top: 20px; text-align: center; font-style: italic;">
            *Waktu tempuh dihitung berdasarkan rata-rata kecepatan jalan kaki standar.
        </p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/config.js?v=2"></script>
    <script src="./js/map-layers.js?v=3"></script>
    <script src="./js/routing.js?v=2"></script>
    <script src="./js/legend.js?v=2"></script>
    <script src="./js/search.js?v=6"></script>
    <script src="./js/bootstrap.js?v=2"></script>

</body>
</html>
